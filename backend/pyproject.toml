[project]
name = "wehire-backend"
version = "0.1.0"
description = "WeHire recruitment screening API"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.13,<2.0",
    "email-validator>=2.4.0",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
]

[tool.uv]
# Run app.main directly; this service is not published as a Python package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
